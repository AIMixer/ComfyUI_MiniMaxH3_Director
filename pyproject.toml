[project]
name = "minimax-h3-director-pro"
description = "Independently maintained MiniMax H3 and Pika H3 Flex timeline director, based on AIMixer."
version = "1.1.0"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Repository = "https://github.com/H-Bole/ComfyUI-MiniMax-H3-Director-Pro"
Documentation = "https://github.com/H-Bole/ComfyUI-MiniMax-H3-Director-Pro#readme"
"Bug Tracker" = "https://github.com/H-Bole/ComfyUI-MiniMax-H3-Director-Pro/issues"

[tool.comfy]
DisplayName = "MiniMax H3 Director Pro"
Icon = ""
requires-comfyui = ">=0.30.0"
